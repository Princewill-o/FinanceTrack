<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Finance | Smart Financial Management</title>
  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    * { font-family: 'Poppins', 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[var(--bg-primary)] text-[var(--text-primary)]">

  <!-- LANDING PAGE -->
  <div id="landingView" class="w-full min-h-screen">
    <section class="bg-[url('https://raw.githubusercontent.com/prebuiltui/prebuiltui/main/assets/hero/gridBackground.png')] w-full bg-no-repeat bg-cover bg-center text-sm pb-32 min-h-screen">
      <nav class="flex items-center justify-between p-4 md:px-16 lg:px-24 xl:px-32 md:py-6 w-full">
        <!-- BRAND LOGO -->
        <a href="index.html" class="flex items-center gap-2 font-bold text-xl tracking-tight text-slate-900">
          <span class="bg-slate-900 text-white px-2.5 py-1 rounded-lg text-sm font-semibold">GF</span>
          <span>Grace Finance</span>
        </a>

        <!-- NAV ACTION & THEME TOGGLE -->
        <div class="flex items-center gap-3">
          <button id="landingThemeBtn" onclick="toggleLandingTheme()" class="p-2 text-slate-700 hover:text-slate-900 rounded-full hover:bg-slate-100 transition" title="Toggle Light/Dark Mode">
            <i class="fa-solid fa-moon text-lg" id="landingThemeIcon"></i>
          </button>
          <a href="tracker.html" class="bg-slate-900 hover:bg-black text-white px-6 py-2.5 rounded-full font-medium transition shadow-md cursor-pointer inline-block">
            Open Finance Tracker
          </a>
        </div>
      </nav>

      <!-- HERO TITLE & SUBTITLE -->
      <h1 class="text-4xl md:text-6xl font-bold max-w-[850px] text-center mx-auto mt-16 text-slate-900 leading-tight">
        Master your budget & outgoings with precision
      </h1>

      <p class="text-base md:text-lg mx-auto max-w-2xl text-center mt-6 max-md:px-4 text-slate-600">
        Track your salary, outgoings, food costs, and upcoming calendar events in one simple Notion-style workspace. Export formula-ready Excel spreadsheets anytime.
      </p>

      <!-- SINGLE HERO BUTTON -->
      <div class="mx-auto w-full flex items-center justify-center mt-8">
        <a href="tracker.html" class="bg-slate-900 hover:bg-black text-white px-8 py-3.5 rounded-full font-medium text-base transition shadow-lg hover:shadow-xl cursor-pointer inline-block">
          Open Finance Tracker
        </a>
      </div>
    </section>
  </div>

  <script>
    function toggleLandingTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('notion_theme', newTheme);

      const icon = document.getElementById('landingThemeIcon');
      if (icon) {
        icon.className = newTheme === 'dark' ? 'fa-solid fa-sun text-lg text-yellow-400' : 'fa-solid fa-moon text-lg';
      }
    }

    // BACKSPACE LISTENER ON LANDING PAGE
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' || e.keyCode === 8) {
        const active = document.activeElement;
        const tag = active ? active.tagName.toLowerCase() : '';
        if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
          e.preventDefault();
          window.location.href = 'tracker.html';
        }
      }
    });
  </script>
</body>
</html>
